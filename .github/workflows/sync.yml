name: Update submodules

on:
  push:
    paths:
      - .gitmodules
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: submodule
  cancel-in-progress: true
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Update submodules
        run: |
          git config --file .gitmodules --get-regexp 'submodule\..*\.branch' | while read -r key value; do
            path="${key#submodule.}"
            path="${path%.branch}"
            echo "Updating $path → $value"
            cd "$path"
            git checkout "$value"
            git pull origin "$value"
            cd ..
          done

      - name: Push
        run: |
          git config user.name "oSoWoSo[bot]"
          git config user.email "mail@osowoso.org"
          git add --all
          git commit -m "sync" || echo "No changes to commit"
          git push origin HEAD
