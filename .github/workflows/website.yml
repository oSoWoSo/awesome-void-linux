name: Build GitHub Pages from md files

on:
  push:
    branches:
      - main
    paths:
      - '*.md'
      - '*.opml'
      - 'create-web'
      - 'docs/*'
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🔑 Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: 🛎️ Checkout (as bot)
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install Pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Create docs directory
        run: mkdir -p docs

      - name: Make pages
        run: |
          chmod a+x create-web
          ./create-web build
      
      - name: 🤖 Commit as GitHub App
        run: |
          git config user.name "oSoWoSo[bot]"
          git config user.email "mail@osowoso.org"

          git add docs/*
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          # Plain commit (not --amend): keeps the author's history intact.
          git commit -m "Update generated pages [skip ci]"
          git push origin HEAD
 
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
